<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zapzap:// p2p</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0a0d0a;
    --bg-panel: #10140f;
    --bg-input: #0d110c;
    --amber: #ffb000;
    --amber-dim: #a86f00;
    --amber-faint: #4a3400;
    --green-ok: #5fd75f;
    --red-err: #ff5f5f;
    --border: #2a2f24;
    --text: #d8d3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  ::selection { background: var(--amber); color: #000; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--amber-faint); border: 2px solid var(--bg); }

  button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--amber-dim);
    background: transparent;
    color: var(--amber);
    padding: 10px 16px;
    font-size: 13px;
    letter-spacing: 0.05em;
    transition: background 0.15s, color 0.15s;
  }
  button:hover { background: var(--amber); color: #000; }
  button.ghost { border-color: var(--border); color: var(--amber-dim); }
  button.ghost:hover { background: var(--border); color: var(--text); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:disabled:hover { background: transparent; color: var(--amber); }

  input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--amber);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
  }
  input:focus { border-color: var(--amber-dim); }

  /* ---------- Tela inicial ---------- */
  #lobby {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .terminal-box {
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    box-shadow: 0 0 0 1px #000, 0 0 40px rgba(255,176,0,0.04);
  }
  .terminal-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--amber-dim); letter-spacing: 0.06em;
  }
  .terminal-titlebar .dots span {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber-faint); margin-right: 5px;
  }
  .terminal-body { padding: 24px; }
  .terminal-body h1 { font-size: 18px; margin: 0 0 4px; color: var(--amber); }
  .terminal-body .sub { font-size: 12px; color: var(--amber-dim); margin-bottom: 22px; line-height: 1.6; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 11px; color: var(--amber-dim);
    margin-bottom: 6px; letter-spacing: 0.08em;
  }
  .field label::before { content: '> '; }
  .field input { width: 100%; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; }
  .divider {
    text-align: center; font-size: 11px; color: #4a4632;
    margin: 22px 0; letter-spacing: 0.1em;
  }
  #lobbyMsg { font-size: 12px; margin-top: 14px; min-height: 16px; }
  #lobbyMsg.err { color: var(--red-err); }
  #lobbyMsg.ok { color: var(--green-ok); }

  /* ---------- Sala (chamada + chat) ---------- */
  #room { display: none; min-height: 100vh; flex-direction: column; }
  .room-header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--amber-dim);
  }
  .room-header .code { color: var(--amber); }
  .status-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; background: #555;
  }
  .status-dot.on { background: var(--green-ok); box-shadow: 0 0 6px var(--green-ok); }
  .status-dot.wait { background: var(--amber-dim); }

  .call-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .video-box {
    background: #000;
    aspect-ratio: 4/3;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .video-box video, .video-box img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .video-box .label {
    position: absolute; bottom: 8px; left: 10px;
    font-size: 11px; color: var(--amber);
    background: rgba(0,0,0,0.5); padding: 2px 8px;
    letter-spacing: 0.05em;
  }
  .video-box .placeholder {
    color: #444; font-size: 12px; text-align: center; padding: 20px;
  }

  .call-controls {
    display: flex; gap: 10px; justify-content: center;
    padding: 12px; border-bottom: 1px solid var(--border);
  }

  .chat-area {
    flex: 1; display: flex; flex-direction: column; min-height: 240px;
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .msg-line { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg-line .ts { color: #55503a; margin-right: 8px; }
  .msg-line .who { font-weight: 700; margin-right: 6px; }
  .msg-line.own .who { color: var(--green-ok); }
  .msg-line.peer .who { color: var(--amber); }
  .msg-line.sys { color: #5a5540; font-style: italic; }
  .composer {
    border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px;
  }
  .composer input { flex: 1; }

  @media (max-width: 640px) {
    .call-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="lobby">
  <div class="terminal-box">
    <div class="terminal-titlebar">
      <span>zapzap://p2p — sem servidor, sem nuvem</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>
    <div class="terminal-body">
      <h1>SALA PRIVADA</h1>
      <div class="sub">conexão direta entre dois navegadores. nada passa por servidor seu — nem da Amazon, nem de ninguém.</div>

      <div class="field">
        <label for="myName">seu nome</label>
        <input id="myName" placeholder="ex: neo">
      </div>

      <button id="createBtn" style="width:100%">criar sala nova</button>

      <div class="divider">— ou —</div>

      <div class="field">
        <label for="joinCode">código da sala</label>
        <div class="row">
          <input id="joinCode" placeholder="ex: X7K2P9">
          <button id="joinBtn">entrar</button>
        </div>
      </div>

      <div id="lobbyMsg"></div>
    </div>
  </div>
</div>

<div id="room">
  <div class="room-header">
    <div><span class="status-dot" id="statusDot"></span><span id="statusText">conectando...</span></div>
    <div>sala: <span class="code" id="roomCodeLabel"></span></div>
  </div>

  <div class="call-grid">
    <div class="video-box">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="label" id="localLabel">você</div>
    </div>
    <div class="video-box">
      <img id="remoteImg" style="display:none">
      <div class="placeholder" id="remotePlaceholder">aguardando o outro lado ligar a câmera...</div>
      <div class="label" id="remoteLabel">peer</div>
    </div>
  </div>

  <div class="call-controls">
    <button id="camBtn">ligar câmera</button>
    <button id="leaveBtn" class="ghost">sair da sala</button>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="messageInput" placeholder="digite e pressione enter..." autocomplete="off">
      <button id="sendBtn">enviar</button>
    </div>
  </div>
</div>

<script>
const lobby = document.getElementById('lobby');
const room = document.getElementById('room');
const lobbyMsg = document.getElementById('lobbyMsg');

let peer = null;
let conn = null;
let myName = 'eu';
let peerName = 'peer';
let localStream = null;
let snapshotInterval = null;
let roomCode = null;
let isHost = false;

function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function showLobbyMsg(text, kind) {
  lobbyMsg.textContent = text;
  lobbyMsg.className = kind || '';
  if (kind === 'err') setLobbyBusy(false);
}

const createBtn = document.getElementById('createBtn');
const joinBtn = document.getElementById('joinBtn');

function setLobbyBusy(busy) {
  createBtn.disabled = busy;
  joinBtn.disabled = busy;
}

createBtn.onclick = () => {
  myName = document.getElementById('myName').value.trim() || 'anfitrião';
  roomCode = randomCode();
  isHost = true;
  setLobbyBusy(true);
  startPeer('zzp-' + roomCode);
};

joinBtn.onclick = () => {
  myName = document.getElementById('myName').value.trim() || 'convidado';
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (!code) { showLobbyMsg('digita o código da sala.', 'err'); return; }
  roomCode = code;
  isHost = false;
  setLobbyBusy(true);
  startPeer(); // peer com id aleatório, depois conecta no host
};

// Config de rede: STUN do Google pra achar rota direta, e um TURN público
// de reserva pra quando a rota direta falha (rede fechada, mesmo Wi-Fi nos
// dois lados, 4G, firewall corporativo, etc). Sem isso, a conexão pode
// ficar tentando pra sempre sem nunca dar erro nem sucesso.
const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};
const CONNECT_TIMEOUT_MS = 15000;

function startPeer(fixedId) {
  showLobbyMsg('conectando ao servidor de sinalização...', '');
  peer = fixedId ? new Peer(fixedId, { config: ICE_CONFIG, debug: 0 }) : new Peer(undefined, { config: ICE_CONFIG, debug: 0 });

  peer.on('open', () => {
    if (isHost) {
      showLobbyMsg('sala criada. compartilhe o código: ' + roomCode, 'ok');
      peer.on('connection', (c) => {
        if (conn) { c.close(); return; } // só 2 pessoas por sala
        conn = c;
        wireConnection();
      });
      // dá um tempinho pra pessoa ver o código antes de entrar na sala
      setTimeout(() => enterRoom(), 900);
    } else {
      showLobbyMsg('sala encontrada, estabelecendo conexão direta... (0s)', '');
      conn = peer.connect('zzp-' + roomCode, { reliable: true });

      let elapsed = 0;
      const tickId = setInterval(() => {
        elapsed++;
        if (!conn || !conn.open) {
          showLobbyMsg('sala encontrada, estabelecendo conexão direta... (' + elapsed + 's)', '');
        }
      }, 1000);

      const timeoutId = setTimeout(() => {
        if (!conn || !conn.open) {
          clearInterval(tickId);
          showLobbyMsg('não consegui conectar (rede bloqueou a conexão direta). tenta de novo — se persistir, teste com os dois em redes diferentes (ex: um no wifi, outro no 4G).', 'err');
          if (peer) peer.destroy();
          peer = null;
          conn = null;
        }
      }, CONNECT_TIMEOUT_MS);

      conn.on('open', () => {
        clearInterval(tickId);
        clearTimeout(timeoutId);
        wireConnection();
        enterRoom();
      });
      conn.on('error', (e) => {
        clearInterval(tickId);
        clearTimeout(timeoutId);
        console.error(e);
        showLobbyMsg('não achei essa sala. confere o código.', 'err');
      });
    }
  });

  peer.on('call', (call) => {
    // não usamos peer.call de vídeo continuo, so respondemos por segurança
    call.close();
  });

  peer.on('error', (err) => {
    console.error(err);
    if (err.type === 'peer-unavailable') {
      showLobbyMsg('sala não encontrada, confere o código.', 'err');
    } else if (err.type === 'network' || err.type === 'server-error') {
      showLobbyMsg('servidor de sinalização instável, tenta de novo em alguns segundos.', 'err');
    } else {
      showLobbyMsg('erro de conexão: ' + err.type, 'err');
    }
  });

  peer.on('disconnected', () => {
    showLobbyMsg('conexão com o servidor de sinalização caiu. tenta recarregar a página.', 'err');
  });
}

function wireConnection() {
  conn.on('data', (msg) => handleData(msg));
  conn.on('close', () => {
    addSystemMessage(peerName + ' saiu da sala.');
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = 'desconectado';
    document.getElementById('remoteImg').style.display = 'none';
    document.getElementById('remotePlaceholder').style.display = 'block';
    document.getElementById('remotePlaceholder').textContent = 'o outro lado saiu.';
  });
  // troca de nomes assim que conecta
  sendData({ type: 'hello', name: myName });
  document.getElementById('statusDot').className = 'status-dot on';
  document.getElementById('statusText').textContent = 'conectado';
}

function handleData(msg) {
  if (msg.type === 'hello') {
    peerName = msg.name;
    document.getElementById('remoteLabel').textContent = peerName;
    addSystemMessage(peerName + ' entrou na sala.');
  } else if (msg.type === 'chat') {
    appendMessage(peerName, msg.text, false);
  } else if (msg.type === 'photo') {
    const img = document.getElementById('remoteImg');
    img.src = msg.data;
    img.style.display = 'block';
    document.getElementById('remotePlaceholder').style.display = 'none';
  } else if (msg.type === 'cam-off') {
    document.getElementById('remoteImg').style.display = 'none';
    document.getElementById('remotePlaceholder').style.display = 'block';
    document.getElementById('remotePlaceholder').textContent = peerName + ' desligou a câmera.';
  }
}

function sendData(obj) {
  if (conn && conn.open) conn.send(obj);
}

function enterRoom() {
  lobby.style.display = 'none';
  room.style.display = 'flex';
  document.getElementById('roomCodeLabel').textContent = roomCode;
  document.getElementById('localLabel').textContent = myName;
  addSystemMessage('sala "' + roomCode + '" iniciada. mensagens não passam por nenhum servidor.');
}

// ---------- Câmera + snapshot a cada 1s ----------
const camBtn = document.getElementById('camBtn');
camBtn.onclick = async () => {
  if (localStream) {
    stopCamera();
    return;
  }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 }, audio: false });
    document.getElementById('localVideo').srcObject = localStream;
    camBtn.textContent = 'desligar câmera';

    const canvas = document.createElement('canvas');
    canvas.width = 320;
    canvas.height = 240;
    const ctx = canvas.getContext('2d');
    const videoEl = document.getElementById('localVideo');

    snapshotInterval = setInterval(() => {
      if (!videoEl.videoWidth) return;
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
      sendData({ type: 'photo', data: dataUrl });
    }, 1000);
  } catch (e) {
    showRoomError('não consegui acessar sua câmera: ' + e.message);
  }
};

function stopCamera() {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  document.getElementById('localVideo').srcObject = null;
  clearInterval(snapshotInterval);
  camBtn.textContent = 'ligar câmera';
  sendData({ type: 'cam-off' });
}

function showRoomError(text) {
  addSystemMessage(text);
}

document.getElementById('leaveBtn').onclick = () => {
  stopCamera();
  if (conn) conn.close();
  if (peer) peer.destroy();
  location.reload();
};

// ---------- Chat ----------
const messageInput = document.getElementById('messageInput');
document.getElementById('sendBtn').onclick = sendMessage;
messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

function sendMessage() {
  const text = messageInput.value.trim();
  if (!text) return;
  sendData({ type: 'chat', text });
  appendMessage(myName, text, true);
  messageInput.value = '';
}

function appendMessage(who, text, own) {
  const messagesEl = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg-line ' + (own ? 'own' : 'peer');
  const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<span class="ts">[${time}]</span><span class="who">${escapeHtml(who)}:</span>${escapeHtml(text)}`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystemMessage(text) {
  const messagesEl = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg-line sys';
  div.textContent = '· ' + text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
